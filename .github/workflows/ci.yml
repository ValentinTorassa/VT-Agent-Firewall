name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19; change the image on purpose.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python }}'
      - name: Unit and acceptance tests
        run: python -m unittest discover -s tests -v
      - name: Health check
        run: python scripts/run_demo.py --health
      # The demo is the claim the README makes: every exfiltration attempt is
      # blocked and audited, and the loopback receiver collects nothing.
      - name: End-to-end prompt-injection demo
        run: python scripts/run_demo.py
      - name: Package builds and imports
        run: |
          python -m pip install --quiet .
          cd /tmp && python -c "import agent_firewall; print(agent_firewall.__all__)"
          vt-agent-firewall-mcp --help
          vt-agent-firewall-hook --help
          vt-agent-firewall-propose --help
